<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小清水蓮布教メーカー</title>
<style>

@font-face{
  font-family:"KeiFont";
  src:url("keifont.ttf") format("truetype");
}

*{box-sizing:border-box}
body{
  margin:0;
  padding:22px;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:linear-gradient(135deg,#ffd56a,#ffb347);
  color:#203040;
}
.opening{
  position:fixed;
  inset:0;
  z-index:9999;
  background:linear-gradient(135deg,#ffe36d,#ff9f2f);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .7s ease, visibility .7s ease;
}
.opening.hide{
  opacity:0;
  visibility:hidden;
}
.openingText{
  font-family:"KeiFont",sans-serif;
  font-size:42px;
  color:#ff9f00;
  text-shadow:
    -2px -2px 0 #fff,
     2px -2px 0 #fff,
    -2px  2px 0 #fff,
     2px  2px 0 #fff,
     0 5px 14px rgba(0,0,0,.25);
}
.claw{
  position:absolute;
  width:260px;
  height:260px;
  transform:rotate(-18deg);
}
.claw span{
  position:absolute;
  top:-20px;
  width:34px;
  height:0;
  background:linear-gradient(180deg,#ff37b7,#ff6ad5);
  clip-path:polygon(50% 0%,100% 10%,70% 100%,35% 100%,0% 10%);
  filter:drop-shadow(0 0 10px rgba(255,55,183,.9));
  animation:scratch .38s cubic-bezier(.2,1,.2,1) forwards;
}
.claw span::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(255,255,255,.85),transparent 35%,transparent);
  clip-path:inherit;
}
.claw span:nth-child(1){left:30px;animation-delay:.18s}
.claw span:nth-child(2){left:105px;animation-delay:.24s}
.claw span:nth-child(3){left:180px;animation-delay:.30s}
@keyframes scratch{
  0%{height:0;transform:translate(-80px,-90px) scaleY(.2)}
  70%{height:250px;transform:translate(20px,30px) scaleY(1)}
  100%{height:235px;transform:translate(25px,35px) scaleY(1)}
}
.app{
  max-width:920px;
  margin:auto;
  background:rgba(255,255,255,.95);
  border-radius:28px;
  padding:24px;
  box-shadow:0 18px 50px rgba(70,130,180,.18);
}
h1{
  margin:0 0 8px;
  font-size:42px;
  font-family:"KeiFont",sans-serif;
  color:#ff9f00;
  text-shadow:
    -2px -2px 0 #fff,
     2px -2px 0 #fff,
    -2px  2px 0 #fff,
     2px  2px 0 #fff,
     0 5px 14px rgba(0,0,0,.25);
}
p{color:#66788a;line-height:1.7}
.notice{
  color:#d33;
  font-weight:900;
}
label{display:block;margin:18px 0 8px;font-weight:800}
input,textarea{
  width:100%;
  border:1px solid #d9ebf8;
  border-radius:16px;
  padding:14px;
  font-size:15px;
}
textarea{min-height:150px;line-height:1.7}
button,a{
  border:0;
  border-radius:999px;
  padding:12px 16px;
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}
.main{background:#1d9bf0;color:white}
.sub{background:#eaf7ff;color:#1d9bf0}
.ghost{background:#f2f7fb;color:#567}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.templates{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:4px 0 14px;
}
.card{
  flex:0 0 270px;
  border:1px solid #d9ebf8;
  border-radius:22px;
  padding:14px;
  background:#fff;
  box-shadow:0 8px 22px rgba(70,130,180,.1);
}
.card.favorite{order:-1;border-color:#f2c94c}
.card.active{outline:4px solid rgba(29,155,240,.18)}
.card-title{font-weight:900;margin-bottom:8px}
.card-text{
  font-size:13px;
  color:#66788a;
  line-height:1.6;
  display:-webkit-box;
  -webkit-line-clamp:5;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.fullBtn{
  margin-top:10px;
  padding:0;
  background:none;
  color:#1d9bf0;
  font-weight:900;
}
.catFavBtn{
  width:44px;
  height:38px;
  padding:0;
  background:white;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.catFavBtn svg{
  width:42px;
  height:36px;
}
.catFavBtn path{
  fill:white;
  stroke:#000;
  stroke-width:7;
  stroke-linejoin:round;
  stroke-linecap:round;
}
.catFavBtn.isFavorite path{
  fill:#ffd84d;
  stroke:#000;
}
.addHead{
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:nowrap;
  margin-top:22px;
}
.addHead h2{
  margin:0;
  white-space:nowrap;
}
.addNote{
  color:#d33;
  font-size:11px;
  line-height:1.35;
  margin-top:0;
  font-weight:700;
  white-space:nowrap;
}
.result,.error{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:16px;
}
.result{background:#f5fbff;border:1px solid #d9ebf8}
.error{background:#fff0f0;border:1px solid #ffcfcf;color:#d33}
.activeBox{display:block}
.urlbox{
  word-break:break-all;
  background:white;
  border:1px dashed #abd6f7;
  border-radius:12px;
  padding:12px;
  line-height:1.6;
  font-size:13px;
}
.small{font-size:12px;color:#66788a}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  padding:22px;
  z-index:999;
}
.modal.active{
  display:flex;
  align-items:center;
  justify-content:center;
}
.modal-box{
  width:min(560px,100%);
  max-height:80vh;
  overflow:auto;
  background:white;
  border-radius:24px;
  padding:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.22);
}
.modal-title{
  font-weight:900;
  margin-bottom:12px;
}
.modal-text{
  white-space:pre-wrap;
  line-height:1.8;
  color:#203040;
}
.galleryTitle{
  margin-top:30px;
  margin-bottom:8px;
}
.gallery{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:8px 0 16px;
  scroll-snap-type:x proximity;
}
.gallery img{
  width:280px;
  max-height:500px;
  height:auto;
  object-fit:contain;
  background:#f5fbff;
  border-radius:18px;
  flex-shrink:0;
  scroll-snap-align:start;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}
</style>
</head>
<body>
<div class="opening" id="opening">
  <div class="openingText">小清水蓮</div>
  <div class="claw">
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>

<main class="app">
<h1>
  小清水蓮<br>
  布教メーカー
</h1>

<p>XのURLを貼って、布教テンプレを選んで、返信用URLを作れます。テンプレ追加・お気に入り保存もできます。</p>
<p class="notice">※ この布教テンプレは@2OO6_O41O 様のポストを引用しています。</p>
<label>① XのポストURL</label>
<input id="postUrl" placeholder="https://x.com/xxxxx/status/1234567890">
<h2>② 布教テンプレ</h2>
<div class="templates" id="templates"></div>
<div class="addHead">
  <h2>テンプレを追加</h2>
  <div class="addNote">
    ご自身のテンプレがあれば<br>
    登録して使えます！
  </div>
</div>
<label>テンプレ名</label>
<input id="newTitle" placeholder="例：丁寧お願い / 短文 / 熱量高め">
<label>テンプレ本文</label>
<textarea id="newText" placeholder="ここにテンプレ本文"></textarea>
<div class="row">
  <button class="sub" id="addTemplateBtn">テンプレを追加</button>
  <button class="ghost" id="resetTemplatesBtn">初期テンプレに戻す</button>
</div>
<label>④ リプ文章</label>
<textarea id="replyText" placeholder="テンプレを選ぶか、直接入力してください"></textarea>
<div class="small"><span id="charCount">0</span>文字</div>
<div class="row">
  <button class="main" id="startBtn">スタート</button>
  <button class="ghost" id="clearBtn">クリア</button>
</div>
<div class="error" id="errorBox"></div>
<section class="result" id="resultBox">
  <b>完成URL</b>
  <div class="urlbox" id="resultUrl"></div>
  <div class="row">
    <button class="sub" id="copyBtn">URLをコピー</button>
    <a class="main" id="openBtn" href="#" target="_blank">リプ画面を開く</a>
  </div>
</section>
<h2 class="galleryTitle">⑤ 布教画像</h2>
<p class="notice">画像を長押しすると保存できます。</p>
<div id="gallery" class="gallery"></div>
</main>
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-text" id="modalText"></div>
    <div class="row">
      <button class="ghost" id="closeModalBtn">閉じる</button>
    </div>
  </div>
</div>
<script>
const fukyoImages = [
  "IMG_8777.jpeg",
  "IMG_8778.jpeg",
  "IMG_8901.jpeg",
  "IMG_8902.jpeg",
  "IMG_8903.jpeg",
  "IMG_8904.jpeg",
  "IMG_8905.jpeg",
  "IMG_8906.jpeg",
  "IMG_8907.jpeg",
  "IMG_8927.jpeg",
  "IMG_8928.jpeg",
  "IMG_8929.jpeg",
  "IMG_8930.jpeg",
  "IMG_8931.jpeg"
];
const defaultTemplates = [
  {
    id:"default-1",
    fixed:true,
    title:"布教テンプレ①｜静かに闘志タイプ",
    text:`おすすめから失礼します！小清水蓮くんを布教させてください🐱このオーディションでデビューしたいという気持ちが誰よりも強いと話していて、一緒に頑張る仲間からも「デビューしたい気持ちが伝わる」と言われるほど、静かに闘志を燃やしているアツい練習生です。投票のご検討よろしくお願いします🙇‍♀️`,
    favorite:true,
    favoriteOrder:1
  },
  {
    id:"default-2",
    fixed:true,
    title:"布教テンプレ②｜グローバルランカー",
    text:`おすすめから失礼します！小清水蓮くんを布教させてください🐱今回グローバルランカーでファイナルへの出場を手にし、まさに「新世界」の申し子です！日本からも世界からと注目の集まる彼のビジュアルは絶対にデビューメンバーに必要だと思っています！投票のご検討よろしくお願いします🙇‍♀️`,
    favorite:false,
    favoriteOrder:0
  },
  {
    id:"default-3",
    fixed:true,
    title:"布教テンプレ③｜ギャップ沼",
    text:`おすすめから失礼します！小清水蓮くんを布教させてください🐱可愛らしいこのビジュアルで元々愛嬌したりするのは得意ではなかったり、自認はクールだったり、しっかり者で自分の意見をズバッと言える漢気を持っています。ぜひそのギャップに溺れてほしいです！投票のご検討よろしくお願いします🙇‍♀️`,
    favorite:false,
    favoriteOrder:0
  },
  {
    id:"default-4",
    fixed:true,
    title:"布教テンプレ④｜努力家・求心力",
    text:`おすすめから失礼します！小清水蓮くんを布教させてください🐱前世や活動歴のない中初回8位に入れるほどの求心力があり、デビューグループのファン層の幅を必ず広げてくれると思います。分量が無い中でも朝練に一番に来るなど、ずっと真面目に頑張っていました。投票のご検討よろしくお願いします🙇‍♀️`,
    favorite:false,
    favoriteOrder:0
  }
];
let savedTemplates = JSON.parse(localStorage.getItem("templatesData") || "[]");
let userTemplates = Array.isArray(savedTemplates)
  ? savedTemplates.filter(item=>!item.fixed && !defaultTemplates.some(defaultItem=>defaultItem.title === item.title))
  : [];
let templatesData = [...defaultTemplates, ...userTemplates];
let favoriteCounter = Math.max(0, ...templatesData.map(item=>item.favoriteOrder || 0));
const templates = document.getElementById("templates");
const replyText = document.getElementById("replyText");
const charCount = document.getElementById("charCount");
const postUrl = document.getElementById("postUrl");
const errorBox = document.getElementById("errorBox");
const resultBox = document.getElementById("resultBox");
const resultUrl = document.getElementById("resultUrl");
const openBtn = document.getElementById("openBtn");
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalText = document.getElementById("modalText");
function saveTemplates(){
  localStorage.setItem("templatesData", JSON.stringify(templatesData));
}
function catIcon(isFavorite){
  return `
    <svg viewBox="0 0 240 220" aria-hidden="true">
      <path d="
        M60 36
        L108 70
        Q120 62 132 70
        L180 36
        Q193 27 192 45
        L188 96
        Q207 126 198 157
        Q184 204 120 205
        Q56 204 42 157
        Q33 126 52 96
        L48 45
        Q47 27 60 36
        Z
      "></path>
    </svg>
  `;
}
function renderTemplates(){
  templates.innerHTML = "";
  [...templatesData]
    .sort((a,b)=>{
      if(a.favorite && b.favorite) return (a.favoriteOrder || 0) - (b.favoriteOrder || 0);
      return Number(b.favorite) - Number(a.favorite);
    })
    .forEach(item=>{
      const card = document.createElement("div");
      card.className = "card" + (item.favorite ? " favorite" : "");
      card.innerHTML = `
        <div class="card-title">${item.title}</div>
        <div class="card-text">${item.text}</div>
        <button class="fullBtn fullTextBtn">▼全文を見る</button>
        <div class="row">
          <button class="sub useBtn">この文章を使う</button>
          <button class="main quickOpenBtn">これでリプ画面を開く</button>
          <button class="catFavBtn favBtn ${item.favorite ? "isFavorite" : ""}" title="お気に入り">${catIcon(item.favorite)}</button>
          ${item.fixed ? "" : `<button class="ghost deleteBtn">削除</button>`}
        </div>
      `;
      card.querySelector(".fullTextBtn").onclick = ()=>{
        modalTitle.textContent = item.title;
        modalText.textContent = item.text;
        modal.classList.add("active");
      };
      card.querySelector(".useBtn").onclick = ()=>{
        document.querySelectorAll(".card").forEach(c=>c.classList.remove("active"));
        card.classList.add("active");
        replyText.value = item.text;
        updateCount();
      };
      card.querySelector(".quickOpenBtn").onclick = ()=>{
        const tweetId = getTweetId(postUrl.value.trim());
        if(!postUrl.value.trim()) return showError("XのURLを入力してください。");
        if(!tweetId) return showError("投稿IDを取得できませんでした。");
        const finalUrl =
          `https://twitter.com/intent/tweet?in_reply_to=${tweetId}&text=${encodeURIComponent(item.text)}`;
        replyText.value = item.text;
        updateCount();
        resultUrl.textContent = finalUrl;
        openBtn.href = finalUrl;
        resultBox.classList.add("activeBox");
        window.open(finalUrl, "_blank");
      };
      card.querySelector(".favBtn").onclick = ()=>{
        item.favorite = !item.favorite;
        if(item.favorite){
          favoriteCounter += 1;
          item.favoriteOrder = favoriteCounter;
        }else{
          item.favoriteOrder = 0;
        }
        saveTemplates();
        renderTemplates();
      };
      const deleteBtn = card.querySelector(".deleteBtn");
      if(deleteBtn){
        deleteBtn.onclick = ()=>{
          if(confirm("このテンプレを削除しますか？")){
            templatesData = templatesData.filter(t=>t.id !== item.id);
            saveTemplates();
            renderTemplates();
          }
        };
      }
      templates.appendChild(card);
    });
}
function updateCount(){
  charCount.textContent = replyText.value.length;
}
document.getElementById("addTemplateBtn").onclick = ()=>{
  const title = document.getElementById("newTitle").value.trim();
  const text = document.getElementById("newText").value.trim();
  if(!title || !text){
    alert("テンプレ名と本文を入力してください。");
    return;
  }
  templatesData.push({
    id: crypto.randomUUID(),
    fixed:false,
    title,
    text,
    favorite:false,
    favoriteOrder:0
  });
  saveTemplates();
  renderTemplates();
  document.getElementById("newTitle").value = "";
  document.getElementById("newText").value = "";
};
document.getElementById("resetTemplatesBtn").onclick = ()=>{
  if(confirm("追加したテンプレも消えて、初期状態に戻ります。よろしいですか？")){
    templatesData = defaultTemplates;
    favoriteCounter = 1;
    saveTemplates();
    renderTemplates();
  }
};
function getTweetId(url){
  const match = url.match(/status\/(\d+)/);
  return match ? match[1] : "";
}
function showError(msg){
  errorBox.textContent = msg;
  errorBox.classList.add("activeBox");
  resultBox.classList.remove("activeBox");
}
function hideError(){
  errorBox.classList.remove("activeBox");
}
document.getElementById("startBtn").onclick = ()=>{
  hideError();
  const tweetId = getTweetId(postUrl.value.trim());
  const text = replyText.value.trim();
  if(!postUrl.value.trim()) return showError("XのURLを入力してください。");
  if(!tweetId) return showError("投稿IDを取得できませんでした。");
  if(!text) return showError("リプ文章を入力してください。");
  const finalUrl =
    `https://twitter.com/intent/tweet?in_reply_to=${tweetId}&text=${encodeURIComponent(text)}`;
  resultUrl.textContent = finalUrl;
  openBtn.href = finalUrl;
  resultBox.classList.add("activeBox");
};
document.getElementById("copyBtn").onclick = async ()=>{
  await navigator.clipboard.writeText(resultUrl.textContent);
  document.getElementById("copyBtn").textContent = "コピーしました！";
  setTimeout(()=>document.getElementById("copyBtn").textContent="URLをコピー",1500);
};
document.getElementById("clearBtn").onclick = ()=>{
  postUrl.value = "";
  replyText.value = "";
  resultBox.classList.remove("activeBox");
  hideError();
  updateCount();
};
document.getElementById("closeModalBtn").onclick = ()=>{
  modal.classList.remove("active");
};
modal.onclick = e=>{
  if(e.target === modal){
    modal.classList.remove("active");
  }
};
replyText.addEventListener("input", updateCount);
const gallery = document.getElementById("gallery");
if(gallery){
  fukyoImages.forEach(src=>{
    const img = document.createElement("img");
    img.src = src;
    img.loading = "lazy";
    gallery.appendChild(img);
  });
}
setTimeout(()=>{
  const opening = document.getElementById("opening");
  if(opening){
    opening.classList.add("hide");
  }
},1600);
saveTemplates();
renderTemplates();
updateCount();
</script>
</body>
</html>
